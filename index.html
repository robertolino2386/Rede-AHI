<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor Rede AHI</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    :root {
      --azul-claro: #69A0D3;
      --azul-escuro: #00285C;
      --dourado: #D6AE00;
      --branco: #ffffff;
      --fundo: #f5f7fb;
      --texto: #1b2b41;
      --texto-suave: #667085;
      --borda: #dbe4f0;
      --sombra: rgba(0, 40, 92, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--fundo);
      color: var(--texto);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    .card {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 28px;
      box-shadow: 0 12px 40px var(--sombra);
      overflow: hidden;
    }

    .topo {
      padding: 38px 38px 24px;
      border-bottom: 1px solid var(--borda);
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .selo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid #d8e3f0;
      border-radius: 999px;
      color: var(--azul-escuro);
      font-size: 13px;
      margin-bottom: 18px;
      background: #f8fbff;
      font-weight: 600;
    }

    .ponto {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--dourado);
    }

    h1 {
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.08;
      margin-bottom: 12px;
      letter-spacing: -1px;
      color: var(--azul-escuro);
    }

    .subtitulo {
      color: var(--texto-suave);
      font-size: 16px;
      line-height: 1.6;
      max-width: 680px;
    }

    .conteudo {
      padding: 34px;
    }

    .upload-area {
      border: 1.5px dashed #c7d8ea;
      background: #fafcff;
      border-radius: 24px;
      padding: 34px 30px;
      text-align: center;
      transition: 0.25s ease;
    }

    .upload-area:hover {
      border-color: var(--azul-claro);
      background: #f5faff;
    }

    .icone {
      width: 74px;
      height: 74px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--azul-claro), var(--azul-escuro));
      color: var(--branco);
      font-size: 34px;
      box-shadow: 0 10px 24px rgba(105, 160, 211, 0.22);
    }

    .upload-area h2 {
      font-size: 24px;
      color: var(--azul-escuro);
      margin-bottom: 8px;
    }

    .upload-area p {
      color: var(--texto-suave);
      font-size: 15px;
      margin-bottom: 24px;
    }

    

    input[type="file"] {
      display: none;
    }

    .botoes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: 0.22s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 170px;
    }

    .btn-upload {
      background: var(--azul-claro);
      color: var(--branco);
    }

    .btn-converter {
      background: var(--dourado);
      color: #1d1d1d;
    }

    .btn-baixar {
      background: var(--azul-escuro);
      color: var(--branco);
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .arquivo {
      margin-top: 20px;
      color: var(--azul-escuro);
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }

    .mensagem {
      margin-top: 24px;
      padding: 16px 18px;
      border-radius: 18px;
      display: none;
      line-height: 1.5;
      font-size: 14px;
    }

    .mensagem.sucesso {
      display: block;
      background: #eef8ef;
      border: 1px solid #b8e0bc;
      color: #206737;
    }

    .mensagem.erro {
      display: block;
      background: #fff1f1;
      border: 1px solid #f2b4b4;
      color: #9f2d2d;
    }

    .rodape {
      padding: 18px 34px 30px;
      color: #8a94a6;
      font-size: 13px;
      text-align: center;
    }

    .rodape strong {
      font-style: italic;
    }

    @media (max-width: 640px) {
      .topo, .conteudo {
        padding: 26px 20px;
      }

      .upload-area {
        padding: 28px 18px;
      }

      .campos-formulario {
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="topo">
        <div class="selo"><span class="ponto"></span> Conversor de Comissão</div>
        <h1>Rede AHI</h1>
        <p class="subtitulo">Faça o upload do relatório e baixe um arquivo separado para cada CCPP.</p>
      </div>

      <div class="conteudo">
        <div class="upload-area">
          <div class="icone">↥</div>
          <h2>Enviar relatório da Rede AHI</h2>
          <p>O sistema separa os dados por CCPP e gera as planilhas no layout padrão de comissão.</p>

          <input id="arquivoInput" type="file" accept=".xls,.xlsx,.xlsm" />

          <div class="botoes">
            <label class="btn btn-upload" for="arquivoInput">Escolher arquivo</label>
            <button id="converterBtn" class="btn btn-converter" disabled>Converter</button>
            <button id="baixarBtn" class="btn btn-baixar" disabled>Baixar ZIP</button>
          </div>

          <div id="arquivoNome" class="arquivo"></div>
          <div id="mensagem" class="mensagem"></div>
        </div>
      </div>

      <div class="rodape">Desenvolvido por <strong>Roberto Lino</strong></div>
    </section>
  </main>

  <script>
    const arquivoInput = document.getElementById('arquivoInput');
    const converterBtn = document.getElementById('converterBtn');
    const baixarBtn = document.getElementById('baixarBtn');
    const arquivoNome = document.getElementById('arquivoNome');
    const mensagem = document.getElementById('mensagem');
    const DADOS_FIXOS = {
      cnpj: '43.637.214/0001-86',
      razao: 'Copastur Viagens e Turismo Ltda',
      hotel: '',
      mes: ''
    };

    let arquivoSelecionado = null;
    let zipConvertido = null;

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = `mensagem ${tipo}`;
    }

    function normalizarTexto(texto) {
      return String(texto ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
    }

    function encontrarIndiceCabecalho(linhas) {
      for (let i = 0; i < Math.min(linhas.length, 30); i++) {
        const linhaNormalizada = linhas[i].map(normalizarTexto);
        const temCCPP = linhaNormalizada.includes('ccpp');
        const temConfirmacao = linhaNormalizada.includes('confirmacao');
        const temTarifa = linhaNormalizada.includes('tarifa');
        if (temCCPP && temConfirmacao && temTarifa) return i;
      }
      return 0;
    }

    function montarObjetosPorCabecalho(linhas) {
      const indiceCabecalho = encontrarIndiceCabecalho(linhas);
      const cabecalhos = linhas[indiceCabecalho].map(valor => String(valor ?? '').trim());
      const mapa = {};

      cabecalhos.forEach((cabecalho, indice) => {
        mapa[normalizarTexto(cabecalho)] = indice;
      });

      return linhas.slice(indiceCabecalho + 1).map(linha => {
        const obj = {};
        Object.keys(mapa).forEach(chave => {
          obj[chave] = linha[mapa[chave]] ?? '';
        });
        return obj;
      });
    }

    function pegar(obj, nomesPossiveis) {
      for (const nome of nomesPossiveis) {
        const chave = normalizarTexto(nome);
        if (Object.prototype.hasOwnProperty.call(obj, chave)) return obj[chave];
      }
      return '';
    }

    function converterNumero(valor) {
      if (valor === null || valor === undefined || valor === '') return 0;
      if (typeof valor === 'number') return valor;

      let texto = String(valor).trim();
      if (!texto) return 0;

      const negativoPorParenteses = texto.startsWith('(') && texto.endsWith(')');
      texto = texto
        .replace(/R\$/g, '')
        .replace(/\s/g, '')
        .replace(/[()]/g, '')
        .replace(/\./g, '')
        .replace(',', '.');

      let numero = Number(texto);
      if (Number.isNaN(numero)) return 0;
      if (negativoPorParenteses) numero = numero * -1;
      return numero;
    }

    function converterData(valor) {
      if (!valor) return '';
      if (valor instanceof Date) return valor;
      if (typeof valor === 'number') {
        const data = XLSX.SSF.parse_date_code(valor);
        if (!data) return valor;
        return new Date(data.y, data.m - 1, data.d);
      }

      const texto = String(valor).trim();
      const dataBR = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (dataBR) {
        const dia = Number(dataBR[1]);
        const mes = Number(dataBR[2]) - 1;
        let ano = Number(dataBR[3]);
        if (ano < 100) ano += 2000;
        return new Date(ano, mes, dia);
      }

      const data = new Date(texto);
      return Number.isNaN(data.getTime()) ? texto : data;
    }

    function texto(valor) {
      return String(valor ?? '').trim();
    }

    function agruparPorCCPP(dados) {
      const grupos = {};

      dados.forEach(item => {
        const ccpp = texto(pegar(item, ['CCPP']));
        if (!ccpp) return;

        if (!grupos[ccpp]) grupos[ccpp] = [];
        grupos[ccpp].push({
          ccpp,
          confirmacao: texto(pegar(item, ['CONFIRMACAO', 'CONFIRMAÇÃO'])),
          hospede: texto(pegar(item, ['PASSAGEIRONACAD', 'PASSAGEIRO NAO CAD', 'PASSAGEIRO NÃO CAD'])),
          checkIn: converterData(pegar(item, ['CHECK-IN', 'CHECK IN'])),
          checkOut: converterData(pegar(item, ['CHECK-OUT', 'CHECK OUT'])),
          diaria: converterNumero(pegar(item, ['VALOR DIÁRIA', 'VALOR DIARIA'])),
          tarifa: converterNumero(pegar(item, ['TARIFA'])),
          comissaoOrigem: converterNumero(pegar(item, ['COMISSAO', 'COMISSÃO']))
        });
      });

      return grupos;
    }

    function pintarCelula(celula, cor) {
      celula.fill = {
        type: 'pattern',
        pattern: 'solid',
        fgColor: { argb: cor.replace('#', 'FF') }
      };
    }

    function aplicarBorda(celula) {
      celula.border = {
        top: { style: 'thin', color: { argb: 'FFD9E3EF' } },
        left: { style: 'thin', color: { argb: 'FFD9E3EF' } },
        bottom: { style: 'thin', color: { argb: 'FFD9E3EF' } },
        right: { style: 'thin', color: { argb: 'FFD9E3EF' } }
      };
    }

    function formatarMoeda(celula) {
      celula.numFmt = 'R$ #,##0.00';
    }

    function formatarData(celula) {
      celula.numFmt = 'dd/mm/yyyy';
    }

    async function criarArquivoPorCCPP(ccpp, linhas) {
      const workbook = new ExcelJS.Workbook();
      const ws = workbook.addWorksheet('Comissão');

      ws.columns = [
        { width: 16 }, { width: 14 }, { width: 34 }, { width: 14 }, { width: 14 },
        { width: 15 }, { width: 10 }, { width: 14 }, { width: 14 }, { width: 18 },
        { width: 18 }, { width: 18 }
      ];

      ws.views = [{ showGridLines: false }];

      ws.getCell('B2').value = 'CNPJ DA AGENCIA';
      ws.getCell('B3').value = 'RAZÃO SOCIAL';
      ws.getCell('B4').value = 'HOTEL';
      ws.getCell('B5').value = 'MÊS VIGENTE';

      ws.getCell('C2').value = DADOS_FIXOS.cnpj;
      ws.getCell('C3').value = DADOS_FIXOS.razao;
      ws.getCell('C4').value = DADOS_FIXOS.hotel;
      ws.getCell('C5').value = DADOS_FIXOS.mes;

      ws.getCell('F2').value = '% de Comissão';
      ws.getCell('G2').value = 0.10;
      ws.getCell('G2').numFmt = '0%';
      ws.getCell('G2').font = { color: { argb: 'FFFF0000' } };

      ws.getCell('E3').value = 'TOTAL';
      ws.getCell('F3').value = { formula: `SUM(I7:I${linhas.length + 6})` };
      formatarMoeda(ws.getCell('F3'));

      ['B2', 'B3', 'B4', 'B5', 'F2', 'E3'].forEach(ref => {
        ws.getCell(ref).font = { bold: true };
      });

      ['C2', 'C3', 'C4', 'C5', 'J7'].forEach(ref => pintarCelula(ws.getCell(ref), '#FFF2CC'));tCell('G2').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFFFF' } };

      const headers = [
        'RESERVA ATLANTICA', 'NOME DO HOSPEDE', 'CHECK IN', 'CHECK OUT',
        'VALOR DA DIÁRIA', 'DIÁRIAS', 'VALOR TOTAL', 'COMISSÃO', 'VALIDAÇÃO HOTEL'
      ];

      const startCconst startCols = ['B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];rs.forEach((header, index) => {
        const cell = ws.getCell(`${startCols[index]}6`);
        cell.value = header;
        cell.font = { bold: true };
        cell.alignment = { horizontal: 'center' };
        if (['H', 'I', 'J'].includes(startCols[index])) pintarCelula(cell, '#E7E6E6');
      });

      

      linhs.getCell(`B${linhaExcel}`).value = item.confirmacao;
        ws.getCell(`C${linhaExcel}`).value = item.hospede;
        ws.getCell(`D${linhaExcel}`).value = item.checkIn;
        ws.getCell(`E${linhaExcel}`).value = item.checkOut;
        ws.getCell(`F${linhaExcel}`).value = item.diaria;
        ws.getCell(`G${linhaExcel}`).value = item.tarifa;
        ws.getCell(`H${linhaExcel}`).value = item.tarifa;
        ws.getCell(`I${linhaExcel}`).value = { formula: `H${linhaExcel}*10%` };
        ws.getCell(`J${linhaExcel}`).value = '';

        formatarData(ws.getCell(`D${linhaExcel}`));
        formatarData(ws.getCell(`E${linhaExcel}`));
        ['F', 'G', 'H', 'I'].forEach(col => formatarMoeda(ws.getCell(`${col}${linhaExcel}`)));
        pintarCelula(ws.getCell(`J${linhaExcel}`), '#FFF2CC');
      });

      const ultimaLinha = linhas.length + 6;
      for (let row = 6; row <= ultpintarCelula(ws.getCell(`J${linhaExcel}`), '#FFF2CC');getCell(row, col));
          ws.getCell(row, col).alignment = for (let row = 6; row <= ultimaLinha; row++) {
        for (let col = 1; col <= 10; col++) {tarCelula(ws.getCell(ref), '#FFF2CC'));

      ws.getRow(6).height = 22;
      ws.getRow(2).height = 20;
      ws.getRow(3).height = 20;
      ws.getRow(4).height = 20;
      ws.getRow(5).height = 20;

      ws.getColumn('C').width = 34;
      ws.getColumn('J').width = 18;
      ws.getColumn('K').width = 18;
      ws.getColumn('L').width = 18;

      const buffer = await workbook.xlsx.writeBuffer();
      return buffer;
  ws.getColumn('J').width = 28;s[0];
      zipConvertido = null;
      baixarBtn.disabled = true;

      if (arquivoSelecionado) {
        arquivoNome.textContent = arquivoSelecionado.name;
        converterBtn.disabled = false;
        mensagem.className = 'mensagem';
        mensagem.textContent = '';
      }
    });

    converterBtn.addEventListener('click', async () => {
      if (!arquivoSelecionado) return;

      

      try {
        mostrarMensagem('Convertendo arquivos por CCPP. Aguarde...', 'sucesso');
        converterBtn.disabled = true;
        baixarBtn.disabled = true;

        const buffer = await arquivoSelecionado.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array', cellDates: true });
        const nomeAba = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[nomeAba];
        const linhas = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '', raw: true });
        const dados = montarObjetosPorCabecalho(linhas);
        const grupos = agruparPorCCPP(dados);
        const ccpps = Object.keys(grupos);

        if (!ccpps.length) {
          mostrarMensagem('Não foi possível localizar dados por CCPP. Verifique se a planilha possui os cabeçalhos esperados.', 'erro');
          converterBtn.disabled = false;
          return;
        }

        const zip = new JSZip();

        for (const ccpp of ccpps) {
          const arquivoBuffer = await criarArquivoPorCCPP(ccpp, grupos[ccpp]);
          const nomeArquivo = `Planilha_AHI_CCPP${ccpp}.xlsx`;
          zip.file(nomeArquivo, arquivoBuffer);
        }

        zipConvertido = await zip.generateAsync({ type: 'blob' });
   const nomeArquivo = `Planilha_AHI_${ccpp}.xlsx`;ado(s) com sucesso. Clique em Baixar ZIP para salvar.`, 'sucesso');
        baixarBtn.disabled = false;
      } catch (erro) {
        mostrarMensagem('Não foi possível converter este arquivo. Selecione a planilha correta e tente novamente.', 'erro');
      } finally {
        converterBtn.disabled = false;
      }
    });

    baixarBtn.addEventListener('click', () => {
      if (!zipConvertido) return;
      const url = URL.createObjectURL(zipConvertido);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Planilhas_AHI_CCPP.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
